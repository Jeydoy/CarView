version: '3.4'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" 
      - "15672:15672" 

  carview:
    image: ${DOCKER_REGISTRY-}carview
    build:
      context: .
      dockerfile: CarView/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_HOST=rabbitmq 
      ports:
      - "8080:8080" 
      - "8081:8081" 
    depends_on:
      - rabbitmq 